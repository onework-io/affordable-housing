# 推上 main 即自動編譯 poc-web 並發佈到 GitHub Pages
# 首次使用：repo Settings → Pages → Build and deployment → Source 選「GitHub Actions」
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: poc-web/package-lock.json
      - run: npm ci
      - run: npm run build:pages
      # 不需要的大檔（舊版環景素材、已打包進程式的站牌資料）
      - run: rm -rf dist-pages/pano dist-pages/data && touch dist-pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: poc-web/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
